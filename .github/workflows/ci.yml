name: CI Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and verify compilation
        run: |
          mkdir -p dist
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=linuxdeepin/deepin:crimson \
            --output type=local,dest=dist \
            -f .github/workflows/Dockerfile .

      - name: Verify .deb was produced
        run: |
          ls -lh dist/
          file dist/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deb-amd64
          path: dist/*.deb
          if-no-files-found: error
